name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (lint, typecheck, unit, build, .NET tests)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Repository verification script
        shell: pwsh
        run: |
          # Surface the tail of a failure as a public annotation (job logs need sign-in to read).
          $output = [System.Collections.Generic.List[string]]::new()
          try {
            ./scripts/verify.ps1 *>&1 | ForEach-Object { $output.Add("$_"); $_ }
            if ($LASTEXITCODE -ne 0) { throw "verify.ps1 exited with $LASTEXITCODE" }
          } catch {
            $output.Add("ERROR: $($_.Exception.Message)")
            $tail = ($output | Select-Object -Last 40) -join '%0A'
            Write-Output "::error title=verify.ps1 failed::$tail"
            exit 1
          }

  e2e:
    name: e2e (headed Chromium journey)
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Install web dependencies and Chromium
        run: |
          npm --prefix apps/web ci
          npm --prefix apps/web exec -- playwright install chromium
      - name: Restore and build API
        run: |
          dotnet restore OfficeCaseFiles.slnx --locked-mode
          dotnet build services/api --no-restore
      - name: Headed E2E on isolated temporary database
        shell: pwsh
        run: |
          # Surface the tail of a failure as a public annotation (job logs need sign-in to read).
          $output = [System.Collections.Generic.List[string]]::new()
          try {
            npm --prefix apps/web run e2e *>&1 | ForEach-Object { $output.Add("$_"); $_ }
            if ($LASTEXITCODE -ne 0) { throw "e2e exited with $LASTEXITCODE" }
          } catch {
            $output.Add("ERROR: $($_.Exception.Message)")
            $logs = Get-ChildItem .tools/e2e -Recurse -Filter *.err.log -ErrorAction SilentlyContinue |
              ForEach-Object { Get-Content $_.FullName -Tail 15 | ForEach-Object { "[$($_)]" } }
            $tail = (@($output | Select-Object -Last 45) + @($logs | Select-Object -Last 20)) -join '%0A'
            Write-Output "::error title=e2e failed::$tail"
            exit 1
          }
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  docker:
    name: docker (build and container smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image and smoke-test the container
        run: bash scripts/docker-smoke.sh
